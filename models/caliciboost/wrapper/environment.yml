name: caliciboost-tdc
channels:
  - conda-forge
dependencies:
  - python=3.10
  - numpy=1.26.4
  - pandas=2.2.3
  - rdkit=2026.3.1
  - tqdm=4.67.3
  - requests=2.34.0
  - urllib3=2.7.0
  - openjdk          # padelpy needs Java; version not pinned (any modern JDK works)
  - pip
  - pip:
    - setuptools==80.10.2
    - scikit-learn==1.2.2
    - xgboost==1.7.3
    - PyTDC==0.3.8
    - padelpy==0.1.14
    - fuzzywuzzy==0.18.0
    - dataclasses-json==0.6.7
